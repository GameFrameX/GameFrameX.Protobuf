syntax = "proto3";
package Auth;

// 权限码白名单枚举。
enum AuthPermission
{
  Login = 1; // 登录权限
  Chat = 2; // 聊天权限
  Trade = 3; // 交易权限
  GmCommand = 4; // GM 指令权限
}

// 权限授予业务错误码（6 位 = 模块ID 220 + 3 位编号）。客户端协议 ErrorCode 以 int 透传：发生错误时赋具体码，成功不赋值（框架默认 0）。
enum AuthErrorCode
{
  NotLoggedIn = 220001; // 会话未绑定玩家（未登录）
  PermissionUnknown = 220002; // 权限码未在白名单定义
  AlreadyGranted = 220003; // 权限已授予（重复授予幂等报错）
  NotGranted = 220004; // 权限未被授予（撤销不存在）
}

// 请求授予玩家权限（操作者=请求者）
message ReqAuthGrant
{
  int64 TargetPlayerId = 1; // 目标玩家ID
  AuthPermission Permission = 2; // 权限码（AuthPermission 白名单）
}

// 返回授予玩家权限结果
message RespAuthGrant
{
}

// 请求撤销玩家权限（操作者=请求者）
message ReqAuthRevoke
{
  int64 TargetPlayerId = 1; // 目标玩家ID
  AuthPermission Permission = 2; // 权限码（AuthPermission 白名单）
}

// 返回撤销玩家权限结果
message RespAuthRevoke
{
}

// 请求查询玩家是否持有权限
message ReqAuthHas
{
  int64 TargetPlayerId = 1; // 目标玩家ID
  AuthPermission Permission = 2; // 权限码（AuthPermission 白名单）
}

// 返回玩家是否持有权限
message RespAuthHas
{
  bool Granted = 1; // 是否已授予
}

// 请求列举玩家持有的全部权限
message ReqAuthListPermissions
{
  int64 TargetPlayerId = 1; // 目标玩家ID
}

// 返回玩家持有的全部权限列表
message RespAuthListPermissions
{
  repeated AuthPermission Permissions = 1; // 权限列表
}

// 会话恢复成员快照项
message SessionResumeMemberInfo
{
  int64 PlayerId = 1; // 玩家ID
  int32 State = 2; // 成员状态（OnlineMatchMemberState：0=Joined 1=Ready 2=Playing 3=Disconnected 4=Left 5=Kicked）
}

// 请求会话恢复（新物理连接携带登录时获得的会话凭据恢复身份与对局）
message ReqSessionResume
{
  string Token = 1; // 会话凭据（登录响应下发的 SessionToken 明文）
  int64 LastAcknowledgedSequence = 2; // 客户端最后确认的服务器序号（恢复增量的下界；0 = 无进度，回退全量快照）
}

// 返回会话恢复（恢复后的身份绑定、轮换新凭据与对局快照/增量）
message RespSessionResume
{
  int64 PlayerId = 1; // 恢复的玩家ID
  string NewSessionToken = 2; // 轮换后的新会话凭据（旧凭据即刻失效；后续恢复须使用本值）
  bool Recovered = 3; // 是否恢复了进行中的对局（false = 无可恢复对局，身份恢复仍成功）
  int64 MatchId = 4; // 恢复的对局数值标识（未恢复为 0）
  int32 MatchState = 5; // 对局状态（OnlineMatchState：0=Created 1=Waiting 2=Ready 3=Running 4=Settling 5=Completed 6=Closed 7=Cancelled 8=Timeout 9=Failed 10=Aborted 11=SettlementFailed）
  int64 ServerSequence = 6; // 恢复点服务器序号（快照切片序号，后续增量起点）
  bool DeltaAvailable = 7; // 增量是否可用（false = 客户端必须以快照重建本地状态）
  repeated SessionResumeMemberInfo Members = 8; // 对局成员快照（含各成员当前状态）
  bytes GameState = 9; // 玩法私有状态载荷（不透明字节；服务端权威快照切片）
  string Instruction = 10; // 处置说明（增量/快照使用方式）
  int32 MatchResultCode = 11; // 对局业务结果码（0 = 无对局失败；非 0 为 Online 显式段负值）。与 RPC 层 ErrorCode 解耦：恢复流程成功时 ErrorCode = 0 且 NewSessionToken 必达
}
